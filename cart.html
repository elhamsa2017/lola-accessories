<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-storage.js"></script>
    <script src="orders-storage.js"></script>
    <script src="products-storage.js"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
        <script src="auth-guard.js"></script>
        <script src="language.js"></script>
    <title>السلة | لولا اكسسوارات والنيكلس</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo1.jpg" class="logo" alt="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a class="active" href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
            </ul>
        </div>
    </section>

    <main class="section-p1 cart-page">
        <div class="page-intro">
            <p class="admin-kicker">إستكمال عملية الشراء</p>
            <h1>سلة المشتريات</h1>
        </div>

        <div class="cart-layout">
            <div class="cart-items" id="cartItems"></div>

            <aside class="cart-summary">
                <h3>ملخص الطلب</h3>
                <div class="summary-row">
                    <span>المجموع الفرعي</span>
                    <strong id="subtotalPrice">0.00 جنيه</strong>
                </div>
                <div class="shipping-selector">
                    <label for="governorate">المحافظة</label>
                    <select id="governorate">
                        <option value="">اختر المحافظة</option>
                        <option value="القاهرة">القاهرة / خلال 48 ساعة</option>
                        <option value="الجيزة">الجيزة / خلال 48 ساعة</option>
                        <option value="الإسكندرية">الإسكندرية / خلال 48 ساعة</option>
                        <option value="العجمي">العجمي / خلال 48 ساعة</option>
                        <option value="برج العرب">برج العرب / خلال 72 ساعة</option>
                        <option value="كينج مريوط">كينج مريوط / خلال 72 ساعة</option>
                        <option value="العامرية">العامرية / خلال 72 ساعة</option>
                        <option value="الساحل الشمالي">الساحل الشمالي / خلال 7 ايام</option>
                        <option value="البحر الاحمر">البحر الاحمر / 7 ايام</option>
                        <option value="القليوبية">القليوبية / خلال 4 ايام</option>
                        <option value="الدقهلية">الدقهلية / خلال 4 ايام</option>
                        <option value="الشرقية">الشرقية / خلال 4 ايام</option>
                        <option value="الغربية">الغربية / خلال 4 ايام</option>
                        <option value="المنوفية">المنوفية / خلال 4 ايام</option>
                        <option value="البحيرة">البحيرة / خلال 4 ايام</option>
                        <option value="كفر الشيخ">كفر الشيخ / خلال 4 ايام</option>
                        <option value="دمياط">دمياط / خلال 4 ايام</option>
                        <option value="بورسعيد">بورسعيد / خلال 4 ايام</option>
                        <option value="الإسماعيلية">الإسماعيلية / خلال 4 ايام</option>
                        <option value="السويس">السويس / خلال 4 ايام</option>
                        <option value="شرم الشيخ">شرم الشيخ / خلال 7 ايام</option>
                        <option value="الفيوم">الفيوم / خلال 6 ايام</option>
                        <option value="بني سويف">بني سويف / خلال 6 ايام</option>
                        <option value="المنيا">المنيا / خلال 6 ايام</option>
                        <option value="أسيوط">أسيوط / خلال 6 ايام</option>
                        <option value="سوهاج">سوهاج / خلال 6 ايام</option>
                        <option value="قنا">قنا / خلال 6 ايام</option>
                        <option value="الأقصر">الأقصر / خلال 6 ايام</option>
                        <option value="أسوان">أسوان / خلال 6 ايام</option>
                        <option value="الوادي الجديد">الوادي الجديد / خلال 7 ايام</option>
                        <option value="مطروح">مطروح / خلال 7 ايام</option>
                    </select>
                </div>
                <div class="summary-row">
                    <span>الشحن</span>
                    <strong id="shippingPrice">0.00 جنيه</strong>
                </div>
                <div class="summary-row total-row">
                    <span>الإجمالي</span>
                    <strong id="totalPrice">0.00 جنيه</strong>
                </div>
                <button class="normal admin-btn checkout-btn" id="checkoutBtn">تاكيد عملية الشراء</button>
            </aside>
        </div>
    </main>

    <div id="checkoutModal" class="checkout-modal hidden" role="dialog" aria-modal="true" aria-labelledby="checkoutModalTitle">
        <div class="checkout-modal-content">
            <div class="panel-title">
                <h3 id="checkoutModalTitle">بيانات الشحن</h3>
                <button type="button" id="closeCheckoutModal" class="close-form-btn" aria-label="إغلاق">×</button>
            </div>
            <p class="checkout-note">من فضلك اكتب بياناتك لإتمام الطلب</p>
            <form id="checkoutForm" class="checkout-form">
                <label for="customerName">الاسم بالكامل</label>
                <input type="text" id="customerName" autocomplete="name" required>

                <label for="customerPhone">رقم الهاتف</label>
                <input type="tel" id="customerPhone" inputmode="tel" autocomplete="tel" pattern="[0-9+ ]{8,}" required>

                <label for="customerAddress">العنوان بالتفصيل</label>
                <textarea id="customerAddress" rows="3" autocomplete="street-address" required></textarea>

                <button type="submit" class="normal admin-btn checkout-confirm-btn"><i class="fa-brands fa-whatsapp"></i> تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <script>
        const CART_KEY = 'lola-accessories-cart';
        const GOVERNORATE_KEY = 'lola-accessories-governorate';
        const WHATSAPP_NUMBER = '201275258189';
        const SHIPPING_RATES = {
            'القاهرة': 88, 'الجيزة': 88, 'القليوبية': 99, 'الإسكندرية': 60, "شرم الشيخ":176,
            'الدقهلية': 99, 'الشرقية': 99, 'الغربية': 99, 'المنوفية': 99,
            'البحيرة': 99, 'كفر الشيخ': 99, 'دمياط': 99, 'بورسعيد': 99,
            'الإسماعيلية': 99, 'السويس': 99, 'الفيوم': 132, 'بني سويف': 132,
            'المنيا': 132, 'أسيوط': 132, 'سوهاج': 132, 'قنا': 132, 'الأقصر': 137,
            'أسوان': 137, 'الوادي الجديد': 176, 'مطروح': 165, 'العجمي': 71,
            "برج العرب": 82, "كينج مريوط":82, "العامرية":82, "الساحل الشمالي":165, "البحر الاحمر":165, "شرم الشيخ":176, 
        };

        const governorateSelect = document.getElementById('governorate');
        const checkoutModal = document.getElementById('checkoutModal');
        const checkoutForm = document.getElementById('checkoutForm');
        const savedGovernorate = localStorage.getItem(GOVERNORATE_KEY);
        if (savedGovernorate && SHIPPING_RATES[savedGovernorate]) {
            governorateSelect.value = savedGovernorate;
        }

        function getShippingCost() {
            return SHIPPING_RATES[governorateSelect.value] || 0;
        }

        async function loadProducts() {
            return window.productStorage.getProducts([]);
        }

        function getCart() {
            const saved = localStorage.getItem(CART_KEY);
            try { return saved ? JSON.parse(saved) : []; } catch { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function getSellingPrice(product) {
            return Number.isFinite(Number(product.discount_price)) && Number(product.discount_price) > 0 && Number(product.discount_price) < Number(product.price)
                ? Number(product.discount_price)
                : Number(product.price);
        }

        async function renderCart() {
            const cart = getCart();
            const products = await loadProducts();
            const cartItemsContainer = document.getElementById('cartItems');

            if (!cart.length) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">السلة فارغة.</div>';
                document.getElementById('subtotalPrice').textContent = '0.00 جنيه';
                document.getElementById('shippingPrice').textContent = '0.00 جنيه';
                document.getElementById('totalPrice').textContent = '0.00 جنيه';
                return;
            }

            let subtotal = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                const product = products.find(p => String(p.id) === String(item.id));
                if (!product) return '';
                const itemTotal = getSellingPrice(product) * item.quantity;
                subtotal += itemTotal;

                return `
                    <div class="cart-item">
                        <img src="${product.imageUrl}" alt="${product.name}">
                        <div class="cart-item-info">
                            <h4>${product.name}</h4>
                            <p>${product.category}</p>
                            <div class="cart-item-controls">
                                <button class="qty-btn" data-action="minus" data-id="${product.id}">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" data-action="plus" data-id="${product.id}">+</button>
                            </div>
                        </div>
                        <div class="cart-item-price">
                            <strong>${itemTotal.toFixed(2)} جنيه</strong>
                            <button class="remove-btn" data-action="remove" data-id="${product.id}">إزالة</button>
                        </div>
                    </div>
                `;
            }).join('');

            const shipping = getShippingCost();
            const total = subtotal + shipping;
            document.getElementById('subtotalPrice').textContent = `${subtotal.toFixed(2)} جنيه`;
            document.getElementById('shippingPrice').textContent = `${shipping.toFixed(2)} جنيه`;
            document.getElementById('totalPrice').textContent = `${total.toFixed(2)} جنيه`;
        }

        governorateSelect.addEventListener('change', () => {
            localStorage.setItem(GOVERNORATE_KEY, governorateSelect.value);
            renderCart();
        });

        document.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-action]');
            if (!btn) return;

            const cart = getCart();
            const productId = btn.dataset.id;
            const item = cart.find(entry => entry.id === productId);
            if (!item) return;

            if (btn.dataset.action === 'plus') {
                item.quantity += 1;
            }

            if (btn.dataset.action === 'minus') {
                item.quantity -= 1;
                if (item.quantity <= 0) {
                    const index = cart.findIndex(entry => entry.id === productId);
                    cart.splice(index, 1);
                }
            }

            if (btn.dataset.action === 'remove') {
                const index = cart.findIndex(entry => entry.id === productId);
                if (index >= 0) cart.splice(index, 1);
            }

            saveCart(cart);
            renderCart();
            if (window.updateCartCount) window.updateCartCount();
        });

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const cart = getCart();

            if (!cart.length) {
                alert('السلة فارغة');
                return;
            }

            if (!governorateSelect.value) {
                alert('من فضلك اختر المحافظة لحساب تمن الشحن');
                governorateSelect.focus();
                return;
            }

            checkoutModal.classList.remove('hidden');
            document.getElementById('customerName').focus();
        });

        function sendOrderWhatsApp(order, orderItems) {
            const productsMessage = orderItems.map(item =>
                `- ${item.name} | الكمية: ${item.quantity} | السعر: ${Number(item.price || 0).toFixed(2)} جنيه`
            ).join('\n');
            const whatsappMessage = [
                'طلب جديد من متجر Lola Accessories',
                `رقم الطلب: ${order.id}`,
                '',
                `اسم العميل: ${order.customer}`,
                `رقم التليفون: ${order.phone}`,
                `العنوان: ${order.address}`,
                `المحافظة: ${order.governorate}`,
                '',
                'تفاصيل الطلب:',
                productsMessage,
                '',
                `قيمة الشحن: ${order.shipping.toFixed(2)} جنيه`,
                `إجمالي الطلب: ${order.total.toFixed(2)} جنيه`
            ].join('\n');

            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(whatsappMessage)}`;
            const whatsappWindow = window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
            if (!whatsappWindow) {
                window.location.assign(whatsappUrl);
            }
        }

        checkoutForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!checkoutForm.checkValidity()) {
                checkoutForm.reportValidity();
                return;
            }

            const cart = getCart();
            let products;
            try {
                products = await loadProducts();
            } catch {
                alert('تعذر تحميل المنتجات، يرجى المحاولة مرة أخرى.');
                return;
            }
            const orderItems = cart.map(item => {
                const product = products.find(p => p.id === item.id);
                return {
                    id: item.id,
                    name: product ? product.name : 'منتج',
                    price: product ? getSellingPrice(product) : 0,
                    quantity: item.quantity,
                    imageUrl: product?.imageUrl || 'img/products/f1.jpg'
                };
            });

            const order = {
                id: `#${Date.now().toString().slice(-6)}`,
                customer: document.getElementById('customerName').value.trim(),
                phone: document.getElementById('customerPhone').value.trim(),
                address: document.getElementById('customerAddress').value.trim(),
                items: orderItems.length,
                date: new Date().toLocaleDateString(),
                    amount: orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                    total: orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0) + getShippingCost(),
                governorate: governorateSelect.value,
                shipping: getShippingCost(),
                status: 'Pending',
                rawItems: orderItems
            };

            try {
                const orderToSave = {
                    id: order.id,
                    customer_name: order.customer,
                    customer: order.customer,
                    phone: order.phone,
                    address: order.address,
                    governorate: order.governorate,
                    items: order.items,
                    amount: order.amount,
                        shipping: order.shipping,
                        total: order.total,
                    status: order.status,
                    raw_items: order.rawItems
                };

                await window.orderStorage.createOrder(orderToSave);
            } catch (error) {
                console.error('Order save failed:', error);
                alert(error.message || 'تعذر حفظ الطلب في Supabase.');
                return;
            }
            localStorage.setItem(CART_KEY, JSON.stringify([]));
            checkoutModal.classList.add('hidden');
            checkoutForm.reset();
            renderCart();
            if (window.updateCartCount) window.updateCartCount();

            alert('تم تسجيل الطلب. سيتم فتح واتساب لإرسال تفاصيل الطلب.');
            sendOrderWhatsApp(order, orderItems);
        });

        document.getElementById('closeCheckoutModal').addEventListener('click', () => {
            checkoutModal.classList.add('hidden');
        });

        checkoutModal.addEventListener('click', (event) => {
            if (event.target === checkoutModal) checkoutModal.classList.add('hidden');
        });

        renderCart();
    </script>
</body>

</html>
