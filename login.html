<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
	<title>Login | Lola Accessories and Necklaces</title>
	<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
	<main class="login-shell">
		<section class="login-card" aria-labelledby="loginTitle">
			<div class="login-brand">
				<img src="img/logo1.jpg" alt="Lola Accessories and Necklaces logo">
			</div>

			<h1 id="loginTitle">Lola Accessories and Necklaces</h1>
			<p class="login-subtitle">Sign in to continue</p>

			<form id="loginForm" class="login-form">
				<label class="login-field">
					<i class="fa-regular fa-user" aria-hidden="true"></i>
					<span class="sr-only">Email or phone number</span>
					<input type="text" id="loginIdentifier" placeholder="Email or phone number" autocomplete="username" required>
				</label>

				<label class="login-field">
					<i class="fa-solid fa-lock" aria-hidden="true"></i>
					<span class="sr-only">Password</span>
					<input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" minlength="6" required>
				</label>

				<div class="login-options">
					<label class="remember-option">
						<input type="checkbox" id="rememberMe">
						<span>Remember me</span>
					</label>
					<button type="button" id="forgotPassword" class="text-button">Forgot Password?</button>
				</div>

				<button type="submit" class="login-submit">Sign In <span aria-hidden="true">&#8594;</span></button>
				<p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
			</form>

			<p class="register-prompt">Don't have an account? <a href="registration.html">Register</a></p>
		</section>
	</main>

	<script>
		const loginForm = document.getElementById('loginForm');
		const loginMessage = document.getElementById('loginMessage');
		const rememberMe = document.getElementById('rememberMe');
		const loginIdentifier = document.getElementById('loginIdentifier');

		const savedEmail = localStorage.getItem('lola-remembered-email');
		if (savedEmail) {
			loginIdentifier.value = savedEmail;
			rememberMe.checked = true;
		}

		loginForm.addEventListener('submit', (event) => {
			event.preventDefault();
			if (!loginForm.checkValidity()) {
				loginForm.reportValidity();
				return;
			}

			const account = JSON.parse(localStorage.getItem('lola-account') || 'null');
			const identifier = loginIdentifier.value.trim();
			const normalizedIdentifier = identifier.replace(/\s/g, '');
			const matchesIdentifier = account && (
				account.email?.toLowerCase() === identifier.toLowerCase() ||
				account.phone === normalizedIdentifier
			);
			if (!matchesIdentifier || account.password !== document.getElementById('loginPassword').value) {
				loginMessage.textContent = 'Incorrect email/phone or password';
				loginMessage.classList.add('visible');
				return;
			}

			if (rememberMe.checked) {
				localStorage.setItem('lola-remembered-email', identifier);
			} else {
				localStorage.removeItem('lola-remembered-email');
			}

			localStorage.setItem('lola-authenticated', 'true');
			loginMessage.textContent = 'Signed in successfully';
			loginMessage.classList.add('visible');
			const redirectPage = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
			const allowedPages = ['index.html', 'shop.html', 'cart.html', 'admin.html', 'orders.html', 'products.html', 'follow my order.html', 'about.html', 'contact.html', 'language.html'];
			const safeRedirect = allowedPages.includes(redirectPage) ? redirectPage : 'index.html';
			setTimeout(() => window.location.href = safeRedirect, 700);
		});

		document.getElementById('forgotPassword').addEventListener('click', () => {
			loginMessage.textContent = 'Please contact us to reset your password';
			loginMessage.classList.add('visible');
		});
	</script>
	<script src="language.js"></script>
</body>

</html>
