<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
	<title>Login | Lola Accessories and Necklaces</title>
	<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
	<main class="login-shell">
		<section class="login-card" aria-labelledby="loginTitle">
			<div class="login-brand">
				<img src="img/logo1.jpg" alt="Lola Accessories and Necklaces logo">
			</div>

			<h1 id="loginTitle">Lola Accessories and Necklaces</h1>
			<p class="login-subtitle">Sign in to continue</p>

			<form id="loginForm" class="login-form">
				<label class="login-field">
					<i class="fa-regular fa-user" aria-hidden="true"></i>
					<span class="sr-only">Email or phone number</span>
					<input type="text" id="loginIdentifier" placeholder="Email or phone number" autocomplete="username" required>
				</label>

				<label class="login-field">
					<i class="fa-solid fa-lock" aria-hidden="true"></i>
					<span class="sr-only">Password</span>
					<input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" minlength="6" required>
				</label>

				<div class="login-options">
					<label class="remember-option">
						<input type="checkbox" id="rememberMe">
						<span>Remember me</span>
					</label>
					<button type="button" id="forgotPassword" class="text-button">Forgot Password?</button>
				</div>

				<button type="submit" class="login-submit">Sign In <span aria-hidden="true">&#8594;</span></button>
				<p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
			</form>

			<div id="forgotPasswordPanel" class="password-reset-panel hidden">
				<h2>استعادة كلمة المرور</h2>
				<p>أدخلي بريدك الإلكتروني لنرسل لكِ رمز التحقق.</p>
				<form id="forgotPasswordForm" class="login-form">
					<input type="email" id="resetEmail" placeholder="Email Address" autocomplete="email" required>
					<button type="submit" class="login-submit">إرسال رمز التحقق</button>
				</form>
				<form id="resetPasswordForm" class="login-form hidden">
					<input type="text" id="resetCode" placeholder="رمز التحقق" inputmode="numeric" required>
					<input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" minlength="6" required>
					<button type="submit" class="login-submit">تغيير كلمة المرور</button>
				</form>
				<button type="button" id="cancelReset" class="text-button">إلغاء</button>
			</div>

			<p class="register-prompt">Don't have an account? <a href="registration.html">Register</a></p>
		</section>
	</main>

	<script>
		const loginForm = document.getElementById('loginForm');
		const loginMessage = document.getElementById('loginMessage');
		const rememberMe = document.getElementById('rememberMe');
		const loginIdentifier = document.getElementById('loginIdentifier');
		const loginPassword = document.getElementById('loginPassword');
		const forgotPasswordPanel = document.getElementById('forgotPasswordPanel');
		const forgotPasswordForm = document.getElementById('forgotPasswordForm');
		const resetPasswordForm = document.getElementById('resetPasswordForm');
		let resetCode = '';

		const savedEmail = localStorage.getItem('lola-remembered-email');
		const savedPassword = localStorage.getItem('lola-remembered-password');
		if (savedEmail) {
			loginIdentifier.value = savedEmail;
			rememberMe.checked = true;
		}
		if (savedPassword) {
			loginPassword.value = savedPassword;
		}

		loginForm.addEventListener('submit', (event) => {
			event.preventDefault();
			if (!loginForm.checkValidity()) {
				loginForm.reportValidity();
				return;
			}

			const customers = JSON.parse(localStorage.getItem('lola-customers') || '[]');
			const legacyAccount = JSON.parse(localStorage.getItem('lola-account') || 'null');
			const identifier = loginIdentifier.value.trim();
			const normalizedIdentifier = identifier.replace(/\s/g, '');
			const account = customers.find(customer =>
				customer.email?.toLowerCase() === identifier.toLowerCase() || customer.phone === normalizedIdentifier
			) || legacyAccount;
			const matchesIdentifier = account && ((account.email && account.email.toLowerCase() === identifier.toLowerCase()) || (account.phone && account.phone === normalizedIdentifier));
			if (!matchesIdentifier || account.password !== document.getElementById('loginPassword').value) {
				loginMessage.textContent = 'Incorrect email/phone or password';
				loginMessage.classList.add('visible');
				return;
			}

			if (rememberMe.checked) {
				localStorage.setItem('lola-remembered-email', identifier);
				localStorage.setItem('lola-remembered-password', loginPassword.value);
			} else {
				localStorage.removeItem('lola-remembered-email');
				localStorage.removeItem('lola-remembered-password');
			}

			localStorage.setItem('lola-authenticated', 'true');
			loginMessage.textContent = 'Signed in successfully';
			loginMessage.classList.add('visible');
			const redirectPage = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
			const allowedPages = ['index.html', 'shop.html', 'cart.html', 'admin.html', 'orders.html', 'products.html', 'customers.html', 'follow my order.html', 'about.html', 'contact.html', 'language.html'];
			const safeRedirect = allowedPages.includes(redirectPage) ? redirectPage : 'index.html';
			setTimeout(() => window.location.href = safeRedirect, 700);
		});

		document.getElementById('forgotPassword').addEventListener('click', () => {
			const isOpen = !forgotPasswordPanel.classList.contains('hidden');
			forgotPasswordPanel.classList.toggle('hidden', isOpen);
			if (!isOpen) {
				forgotPasswordForm.classList.remove('hidden');
				resetPasswordForm.classList.add('hidden');
			}
		});

		forgotPasswordForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const email = document.getElementById('resetEmail').value.trim().toLowerCase();
			const customers = JSON.parse(localStorage.getItem('lola-customers') || '[]');
			const account = customers.find(customer => customer.email === email);
			if (!account) {
				loginMessage.textContent = 'لا يوجد حساب بهذا البريد الإلكتروني';
				loginMessage.classList.add('visible');
				return;
			}
			resetCode = String(Math.floor(100000 + Math.random() * 900000));
			try {
				const response = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(email), {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
					body: JSON.stringify({ _subject: 'Lola password reset code', message: `Your Lola verification code is: ${resetCode}`, _template: 'table' })
				});
				if (!response.ok) throw new Error('Email request failed');
				forgotPasswordForm.classList.add('hidden');
				resetPasswordForm.classList.remove('hidden');
				loginMessage.textContent = 'تم إرسال رمز التحقق إلى بريدك الإلكتروني';
				loginMessage.classList.add('visible');
			} catch {
				loginMessage.textContent = 'تعذر إرسال البريد الإلكتروني، حاولي مرة أخرى';
				loginMessage.classList.add('visible');
			}
		});

		resetPasswordForm.addEventListener('submit', (event) => {
			event.preventDefault();
			if (document.getElementById('resetCode').value.trim() !== resetCode) {
				loginMessage.textContent = 'رمز التحقق غير صحيح';
				loginMessage.classList.add('visible');
				return;
			}
			const email = document.getElementById('resetEmail').value.trim().toLowerCase();
			const customers = JSON.parse(localStorage.getItem('lola-customers') || '[]');
			const account = customers.find(customer => customer.email === email);
			account.password = document.getElementById('newPassword').value;
			localStorage.setItem('lola-customers', JSON.stringify(customers));
			localStorage.setItem('lola-account', JSON.stringify(account));
			if (localStorage.getItem('lola-remembered-email') === email) {
				localStorage.setItem('lola-remembered-password', account.password);
			}
			loginMessage.textContent = 'تم تغيير كلمة المرور بنجاح';
			loginMessage.classList.add('visible');
			forgotPasswordPanel.classList.add('hidden');
		});

		document.getElementById('cancelReset').addEventListener('click', () => forgotPasswordPanel.classList.add('hidden'));
	</script>
	<script src="language.js"></script>
</body>

</html>
