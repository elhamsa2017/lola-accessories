<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
        <script src="auth-guard.js"></script>
        <script src="language.js"></script>
    <title>إدارة المنتجات |  lola accessories and neckales</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo1.jpg" class="logo" alt="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="shop.html">المتجر</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
            </ul>
        </div>
    </section>

    <main class="admin-dashboard">
        <div class="admin-header">
            <div>
                <p class="admin-kicker">المتجر</p>
                <h1>إدارة المنتجات</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="normal admin-btn small-btn">العودة للوحة التحكم</a>
                <button id="showAddProductForm" class="normal admin-btn">+ إضافة منتج</button>
            </div>
        </div>

        <section class="admin-grid">
            <div class="admin-card">
                <span>إجمالي المنتجات</span>
                <h3 id="totalProductsStat">0</h3>
                <small>عناصر متاحة</small>
            </div>
            <div class="admin-card">
                <span>مخزون منخفض</span>
                <h3 id="lowStockStat">0</h3>
                <small>يتطلب متابعة</small>
            </div>
            <div class="admin-card">
                <span>مميز</span>
                <h3 id="featuredStat">0</h3>
                <small>عناصر مميزة</small>
            </div>
            <div class="admin-card">
                <span>قيمة المخزون</span>
                <h3 id="inventoryValueStat">0 جنيه</h3>
                <small>إجمالي تقديري</small>
            </div>
        </section>

        <section id="productFormSection" class="admin-panel product-form-panel hidden">
            <div class="panel-title">
                <h3 id="formTitle">إضافة منتج جديد</h3>
                <button type="button" id="closeFormButton" class="close-form-btn" aria-label="Close form">×</button>
            </div>

            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-grid">
                    <label>
                        اسم المنتج
                        <input type="text" id="productName" placeholder="مثال: سلسلة ذهبية" required>
                    </label>
                    <label>
                        الفئة
                        <select id="productCategory" required>
                            <option value="Accessories">إكسسوارات</option>
                            <option value="Necklaces">نيكلز</option>
                            <option value="Bags">حقائب</option>
                            <option value="Jewelry">مجوهرات</option>
                        </select>
                    </label>
                    <label>
                        السعر (جنيه)
                        <input type="number" id="productPrice" min="0" step="0.01" placeholder="120.00" required>
                    </label>
                    <label>
                        الكمية المتاحة
                        <input type="number" id="productStock" min="0" placeholder="25" required>
                    </label>
                    <label>
                        الحالة
                        <select id="productStatus">
                            <option value="In Stock">متوفر</option>
                            <option value="Low Stock">غير متوفّر</option>
                            <option value="Need Restock">يحتاج تجديد</option>
                        </select>
                    </label>
                    <label>
                        صورة المنتج من الكمبيوتر
                        <input type="file" id="productImage" accept="image/*">
                    </label>
                    <label class="product-description-field">
                        وصف المنتج
                        <textarea id="productDescription" rows="4" placeholder="اكتبي وصفًا مختصرًا ومميزًا للمنتج"></textarea>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="normal admin-btn">حفظ المنتج</button>
                    <button type="button" id="cancelEditBtn" class="secondary-btn">إلغاء</button>
                </div>
            </form>
        </section>

        <section class="admin-panel full-width-panel">
            <div class="panel-title">
                <h3>قائمة المنتجات</h3>
                <div class="filter-pills" aria-label="Product filters">
                    <button type="button" class="pill active" data-filter="all">الكل</button>
                    <button type="button" class="pill" data-filter="Accessories">الإكسسوارات</button>
                    <button type="button" class="pill" data-filter="Necklaces">النيكلز</button>
                    <button type="button" class="pill" data-filter="Bags">الحقائب</button>
                </div>
            </div>

            <table class="admin-table product-table">
                <thead>
                    <tr>
                        <th>المعرف</th>
                        <th>المنتج</th>
                        <th>الفئة</th>
                        <th>السعر</th>
                        <th>المخزون</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'lola-accessories-products';

        const defaultProducts = [
            { id: 'P101', name: 'سلسلة ذهبية', category: 'Necklaces', price: 120, stock: 44, status: 'In Stock', imageUrl: 'https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=400&q=80' },
            { id: 'P102', name: 'حقيبة مخملية', category: 'Bags', price: 180, stock: 18, status: 'Low Stock', imageUrl: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80' },
            { id: 'P103', name: 'أقراط فاخرة', category: 'Accessories', price: 90, stock: 61, status: 'In Stock', imageUrl: 'https://images.unsplash.com/photo-1535632787350-4e68ef0ac584?auto=format&fit=crop&w=400&q=80' },
            { id: 'P104', name: 'أسورة بسيطة', category: 'Accessories', price: 70, stock: 9, status: 'Need Restock', imageUrl: 'https://images.unsplash.com/photo-1611652022419-a9419f74343d?auto=format&fit=crop&w=400&q=80' }
        ];

        const productFormSection = document.getElementById('productFormSection');
        const productForm = document.getElementById('productForm');
        const showAddProductFormBtn = document.getElementById('showAddProductForm');
        const closeFormButton = document.getElementById('closeFormButton');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const productTableBody = document.getElementById('productTableBody');
        const formTitle = document.getElementById('formTitle');
        const filterButtons = document.querySelectorAll('.pill');

        let currentFilter = 'all';
        let products = loadProducts();

        function loadProducts() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProducts));
                return [...defaultProducts];
            }

            try {
                const parsed = JSON.parse(saved);
                return Array.isArray(parsed) && parsed.length ? parsed : [...defaultProducts];
            } catch {
                return [...defaultProducts];
            }
        }

        function saveProducts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        function getStatusClass(status) {
            switch (status) {
                case 'In Stock': return 'delivered';
                case 'Low Stock': return 'shipped';
                case 'Need Restock': return 'pending';
                default: return 'pending';
            }
        }

        function updateStats() {
            const totalProducts = products.length;
            const lowStockCount = products.filter(product => Number(product.stock) <= 10).length;
            const featuredCount = products.filter(product => product.category === 'Accessories').length;
            const inventoryValue = products.reduce((total, product) => total + (Number(product.price) * Number(product.stock)), 0);

            document.getElementById('totalProductsStat').textContent = totalProducts;
            document.getElementById('lowStockStat').textContent = lowStockCount;
            document.getElementById('featuredStat').textContent = featuredCount;
            document.getElementById('inventoryValueStat').textContent = inventoryValue.toFixed(2) + ' جنيه';
        }

        function renderProducts() {
            const filteredProducts = currentFilter === 'all'
                ? products
                : products.filter(product => product.category === currentFilter);

            productTableBody.innerHTML = filteredProducts.map(product => `
                <tr>
                    <td>#${product.id}</td>
                    <td>
                        <div class="product-name-cell">
                            <span class="product-thumb" style="background-image: url('${product.imageUrl || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80'}');"></span>
                            <span>${product.name}</span>
                        </div>
                    </td>
                    <td>${product.category}</td>
                    <td>${Number(product.price).toFixed(2)} جنيه</td>
                    <td>${product.stock}</td>
                    <td><span class="status ${getStatusClass(product.status)}">${product.status}</span></td>
                    <td>
                        <button type="button" class="action-btn" data-action="edit" data-id="${product.id}">تعديل</button>
                        <button type="button" class="action-btn danger" data-action="delete" data-id="${product.id}">حذف</button>
                    </td>
                </tr>
            `).join('');

            updateStats();
        }

        function openProductForm() {
            productFormSection.classList.remove('hidden');
            productForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeProductForm() {
            productFormSection.classList.add('hidden');
            productForm.reset();
            document.getElementById('productId').value = '';
            formTitle.textContent = 'إضافة منتج جديد';
        }

        function generateProductId() {
            if (!products.length) return 'P101';
            const maxId = products.reduce((max, item) => {
                const numericPart = Number(String(item.id).replace(/\D/g, '')) || 0;
                return Math.max(max, numericPart);
            }, 0);
            return `P${maxId + 1}`;
        }

        function readImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.addEventListener('load', () => resolve(reader.result));
                reader.addEventListener('error', reject);
                reader.readAsDataURL(file);
            });
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('productId').value || generateProductId();
            const existingProduct = products.find(item => item.id === id);
            const imageFile = document.getElementById('productImage').files[0];
            let imageUrl = existingProduct?.imageUrl || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80';

            if (!existingProduct && !imageFile) {
                alert('من فضلك اختاري صورة للمنتج من الكمبيوتر');
                return;
            }

            if (imageFile) {
                if (!imageFile.type.startsWith('image/')) {
                    alert('من فضلك اختاري ملف صورة صالح');
                    return;
                }
                if (imageFile.size > 2 * 1024 * 1024) {
                    alert('من فضلك اختاري صورة حجمها أقل من 2 ميجابايت');
                    return;
                }
                imageUrl = await readImageFile(imageFile);
            }

            const product = {
                id,
                name: document.getElementById('productName').value.trim(),
                category: document.getElementById('productCategory').value,
                price: Number(document.getElementById('productPrice').value),
                stock: Number(document.getElementById('productStock').value),
                status: document.getElementById('productStatus').value,
                description: document.getElementById('productDescription').value.trim(),
                imageUrl
            };

            if (!product.name || (!product.price && product.price !== 0) || (!product.stock && product.stock !== 0)) {
                return;
            }

            const existingIndex = products.findIndex(item => item.id === id);
            if (existingIndex >= 0) {
                products[existingIndex] = product;
            } else {
                products.unshift(product);
            }

            saveProducts();
            renderProducts();
            closeProductForm();
        }

        function handleTableAction(event) {
            const actionButton = event.target.closest('[data-action]');
            if (!actionButton) return;

            const productId = actionButton.dataset.id;
            const product = products.find(item => item.id === productId);
            if (!product) return;

            if (actionButton.dataset.action === 'delete') {
                const confirmDelete = window.confirm(`هل تريد حذف ${product.name}؟`);
                if (!confirmDelete) return;
                products = products.filter(item => item.id !== productId);
                saveProducts();
                renderProducts();
                return;
            }

            if (actionButton.dataset.action === 'edit') {
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productStock').value = product.stock;
                document.getElementById('productStatus').value = product.status;
                document.getElementById('productImage').value = '';
                document.getElementById('productDescription').value = product.description || '';
                formTitle.textContent = 'تعديل المنتج';
                openProductForm();
            }
        }

        productForm.addEventListener('submit', handleSubmit);
        showAddProductFormBtn.addEventListener('click', () => {
            formTitle.textContent = 'إضافة منتج جديد';
            document.getElementById('productId').value = '';
            productForm.reset();
            openProductForm();
        });
        closeFormButton.addEventListener('click', closeProductForm);
        cancelEditBtn.addEventListener('click', closeProductForm);
        productTableBody.addEventListener('click', handleTableAction);

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentFilter = button.dataset.filter;
                filterButtons.forEach(item => item.classList.toggle('active', item === button));
                renderProducts();
            });
        });

        renderProducts();
    </script>
</body>

</html>
