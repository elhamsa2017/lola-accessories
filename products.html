<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
        <script src="language.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-config.js"></script>
        <script src="auth-guard.js"></script>
        <script src="products-storage.js"></script>
    <title>إدارة المنتجات |  lola accessories and neckales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="header">
        <a href="index.html"><img src="img/logo1.jpg" class="logo" alt="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
            </ul>
        </div>
    </section>

    <main class="admin-dashboard">
        <div class="admin-header">
            <div>
                <p class="admin-kicker">المتجر</p>
                <h1>إدارة المنتجات</h1>
            </div>
            <div class="admin-actions">
                <a href="admin.html" class="normal admin-btn small-btn">العودة للوحة التحكم</a>
                <button id="showAddProductForm" class="normal admin-btn">+ إضافة منتج</button>
            </div>
        </div>

        <section class="admin-grid">
            <div class="admin-card">
                <span>إجمالي المنتجات</span>
                <h3 id="totalProductsStat">0</h3>
                <small>عناصر متاحة</small>
            </div>
            <div class="admin-card">
                <span>مخزون منخفض</span>
                <h3 id="lowStockStat">0</h3>
                <small>يتطلب متابعة</small>
            </div>
            <div class="admin-card">
                <span>مميز</span>
                <h3 id="featuredStat">0</h3>
                <small>عناصر مميزة</small>
            </div>
            <div class="admin-card">
                <span>قيمة المخزون</span>
                <h3 id="inventoryValueStat">0 جنيه</h3>
                <small>إجمالي تقديري</small>
            </div>
        </section>

        <section id="productFormSection" class="admin-panel product-form-panel hidden">
            <div class="panel-title">
                <h3 id="formTitle">إضافة منتج جديد</h3>
                <button type="button" id="closeFormButton" class="close-form-btn" aria-label="Close form">×</button>
            </div>

            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-grid">
                    <label>
                        اسم المنتج
                        <input type="text" id="productName" placeholder="مثال: سلسلة ذهبية" required>
                    </label>
                    <label>
                        الفئة
                        <select id="productCategory" required>
                            <option value="Necklaces">كوليهات</option>
                            <option value="Bracelets">اساور</option>
                            <option value="Rings">خواتم</option>
                            <option value="Earings">حلقان</option>
                        </select>
                    </label>
                    <label>
                        السعر (جنيه)
                        <input type="number" id="productPrice" min="0" step="0.01" placeholder="120.00" required>
                    </label>
                    <label class="discount-toggle-field">
                        تفعيل الخصم
                        <span class="checkbox-control">
                            <input type="checkbox" id="discountEnabled">
                            <span>عرض المنتج بسعر مخفض</span>
                        </span>
                    </label>
                    <label id="discountPriceField" class="hidden">
                        السعر بعد الخصم (جنيه)
                        <input type="number" id="discountPrice" min="0" step="0.01" placeholder="90.00">
                    </label>
                    <label>
                        الكمية المتاحة
                        <input type="number" id="productStock" min="0" placeholder="25" required>
                    </label>
                    <label>
                        الحالة
                        <select id="productStatus">
                            <option value="In Stock">متوفر</option>
                            <option value="Low Stock">غير متوفّر</option>
                            <option value="Need Restock">يحتاج تجديد</option>
                            <option value="Sold">تم البيع</option>
                        </select>
                    </label>
                    <label>
                        صورة المنتج من الكمبيوتر
                        <input type="file" id="productImage" accept="image/*">
                    </label>
                    <label>
                        مسار أو رابط الصورة
                        <input type="text" id="productImageUrl" placeholder="img/product.jpg أو https://...">
                    </label>
                    <label class="product-description-field">
                        وصف المنتج
                        <textarea id="productDescription" rows="4" placeholder="اكتبي وصفًا مختصرًا ومميزًا للمنتج"></textarea>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="normal admin-btn">حفظ المنتج</button>
                    <button type="button" id="cancelEditBtn" class="secondary-btn">إلغاء</button>
                    <button type="button" id="migrateImagesBtn" class="secondary-btn">تحويل صور المنتجات الي storage</button>

                </div>
            </form>
        </section>

        <section class="admin-panel full-width-panel">
            <div class="panel-title">
                <h3>قائمة المنتجات</h3>
                <div class="filter-pills" aria-label="Product filters">
                    <button type="button" class="pill active" data-filter="all">الكل</button>
                    <button type="button" class="pill" data-filter="Accessories">الإكسسوارات</button>
                    <button type="button" class="pill" data-filter="Necklaces">النيكلز</button>
                    <button type="button" class="pill" data-filter="Bags">الحقائب</button>
                </div>
            </div>

            <table class="admin-table product-table">
                <thead>
                    <tr>
                        <th>المعرف</th>
                        <th>المنتج</th>
                        <th>الفئة</th>
                        <th>السعر</th>
                        <th>المخزون</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </section>
    </main>

    <script>
        const productFormSection = document.getElementById('productFormSection');
        const productForm = document.getElementById('productForm');
        const showAddProductFormBtn = document.getElementById('showAddProductForm');
        const closeFormButton = document.getElementById('closeFormButton');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const productTableBody = document.getElementById('productTableBody');
        const formTitle = document.getElementById('formTitle');
        const filterButtons = document.querySelectorAll('.pill');
        const discountEnabled = document.getElementById('discountEnabled');
        const discountPriceField = document.getElementById('discountPriceField');
        const discountPrice = document.getElementById('discountPrice');

        let currentFilter = 'all';
        let products = [];

        async function loadProducts() {
            products = await window.productStorage.getProducts();
            return products;
        }

        function getStatusClass(status) {
            switch (status) {
                case 'In Stock': return 'delivered';
                case 'Low Stock': return 'shipped';
                case 'Need Restock': return 'pending';
                case 'Sold': return 'cancelled';
                default: return 'pending';
            }
        }

        function updateStats() {
            const totalProducts = products.length;
            const lowStockCount = products.filter(product => Number(product.stock) <= 10).length;
            const featuredCount = products.filter(product => product.category === 'Accessories').length;
            const inventoryValue = products.reduce((total, product) => total + (Number(product.price) * Number(product.stock)), 0);

            document.getElementById('totalProductsStat').textContent = totalProducts;
            document.getElementById('lowStockStat').textContent = lowStockCount;
            document.getElementById('featuredStat').textContent = featuredCount;
            document.getElementById('inventoryValueStat').textContent = inventoryValue.toFixed(2) + ' جنيه';
        }

        function renderProducts() {
            const filteredProducts = currentFilter === 'all'
                ? products
                : products.filter(product => product.category === currentFilter);

            productTableBody.innerHTML = filteredProducts.map(product => `
                <tr>
                    <td>#${product.id}</td>
                    <td>
                        <div class="product-name-cell">
                            <span class="product-thumb" style="background-image: url('${product.imageUrl || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80'}');"></span>
                            <span>${product.name}</span>
                        </div>
                    </td>
                    <td>${product.category}</td>
                    <td>${Number(product.price).toFixed(2)} جنيه</td>
                    <td>${product.stock}</td>
                    <td><span class="status ${getStatusClass(product.status)}">${product.status}</span></td>
                    <td>
                        <button type="button" class="action-btn" data-action="edit" data-id="${product.id}">تعديل</button>
                        <button type="button" class="action-btn danger" data-action="delete" data-id="${product.id}">حذف</button>
                    </td>
                </tr>
            `).join('');

            updateStats();
        }

        function openProductForm() {
            productFormSection.classList.remove('hidden');
            productForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeProductForm() {
            productFormSection.classList.add('hidden');
            productForm.reset();
            document.getElementById('productId').value = '';
            discountPriceField.classList.add('hidden');
            discountPrice.required = false;
            formTitle.textContent = 'إضافة منتج جديد';
        }

        function toggleDiscountField() {
            const enabled = discountEnabled.checked;
            discountPriceField.classList.toggle('hidden', !enabled);
            discountPrice.required = enabled;
        }

        function generateProductId() {
            if (!products.length) return 'P101';
            const maxId = products.reduce((max, item) => {
                const numericPart = Number(String(item.id).replace(/\D/g, '')) || 0;
                return Math.max(max, numericPart);
            }, 0);
            return `P${maxId + 1}`;
        }

        function readImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.addEventListener('load', () => resolve(reader.result));
                reader.addEventListener('error', reject);
                reader.readAsDataURL(file);
            });
        }

        function getSupabaseErrorMessage(error) {
            if (!error) return 'خطأ غير معروف';
            const details = [error.message, error.details, error.hint, error.code].filter(Boolean);
            return details.length ? details.join(' | ') : String(error);
        }

        async function handleSubmit(event) {
            event.preventDefault();

            if (!productForm.checkValidity()) {
                productForm.reportValidity();
                return;
            }

            const id = document.getElementById('productId').value || generateProductId();
            const existingProduct = products.find(item => String(item.id) === String(id));
            const imageFile = document.getElementById('productImage').files[0];
            let imageUrl = document.getElementById('productImageUrl').value.trim()
                || existingProduct?.imageUrl
                || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80';

            if (imageFile) {
                if (!imageFile.type.startsWith('image/')) {
                    alert('من فضلك اختاري ملف صورة صالح');
                    return;
                }
                imageUrl = await readImageFile(imageFile);
            }

            const product = {
                id,
                name: document.getElementById('productName').value.trim(),
                category: document.getElementById('productCategory').value,
                price: Number(document.getElementById('productPrice').value),
                discount_enabled: discountEnabled.checked,
                discount_price: discountEnabled.checked ? Number(discountPrice.value) : null,
                stock: Number(document.getElementById('productStock').value),
                status: document.getElementById('productStatus').value,
                description: document.getElementById('productDescription').value.trim(),
                imageUrl
            };

            if (!product.name || !Number.isFinite(product.price) || !Number.isFinite(product.stock) ||
                (product.discount_enabled && (!Number.isFinite(product.discount_price) || product.discount_price >= product.price))) {
                alert('من فضلك أدخلي اسم المنتج والسعر والكمية بشكل صحيح');
                return;
            }

            const existingIndex = products.findIndex(item => String(item.id) === String(id));
            try {
                if (existingIndex >= 0) {
                    await window.productStorage.updateProduct(id, product);
                    products[existingIndex] = product;
                } else {
                    const savedProduct = await window.productStorage.addProduct(product);
                    products.unshift(savedProduct || product);
                }
            } catch (error) {
                console.error('Product save failed:', error);
                alert(`تعذر حفظ المنتج في Supabase: ${getSupabaseErrorMessage(error)}`);
                return;
            }
            renderProducts();
            closeProductForm();
            alert('تم حفظ المنتج بنجاح');
        }

        async function handleTableAction(event) {
            const actionButton = event.target.closest('[data-action]');
            if (!actionButton) return;

            const productId = actionButton.dataset.id;
            const product = products.find(item => item.id === productId);
            if (!product) return;

            if (actionButton.dataset.action === 'delete') {
                const confirmDelete = window.confirm(`هل تريد حذف ${product.name}؟`);
                if (!confirmDelete) return;
                try {
                    await window.productStorage.deleteProduct(productId);
                } catch (error) {
                    console.error('Product delete failed:', error);
                    alert(`تعذر حذف المنتج من Supabase: ${getSupabaseErrorMessage(error)}`);
                    return;
                }
                products = products.filter(item => String(item.id) !== String(productId));
                renderProducts();
                return;
            }

            if (actionButton.dataset.action === 'edit') {
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productPrice').value = product.price;
                discountEnabled.checked = product.discount_enabled === true;
                discountPrice.value = product.discount_price ?? '';
                toggleDiscountField();
                document.getElementById('productStock').value = product.stock;
                document.getElementById('productStatus').value = product.status;
                document.getElementById('productImage').value = '';
                document.getElementById('productImageUrl').value = product.imageUrl || '';
                document.getElementById('productDescription').value = product.description || '';
                formTitle.textContent = 'تعديل المنتج';
                openProductForm();
            }
        }

        productForm.addEventListener('submit', handleSubmit);
        discountEnabled.addEventListener('change', toggleDiscountField);
        showAddProductFormBtn.addEventListener('click', () => {
            formTitle.textContent = 'إضافة منتج جديد';
            document.getElementById('productId').value = '';
            productForm.reset();
            openProductForm();
        });
        closeFormButton.addEventListener('click', closeProductForm);
        cancelEditBtn.addEventListener('click', closeProductForm);
        productTableBody.addEventListener('click', handleTableAction);

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentFilter = button.dataset.filter;
                filterButtons.forEach(item => item.classList.toggle('active', item === button));
                renderProducts();
            });
        });

        loadProducts().then(renderProducts).catch(() => {
            alert('تعذر تحميل المنتجات من Supabase. تحققي من الاتصال والصلاحيات.');
        });
    </script>

<script>
document.getElementById('migrateImagesBtn')?.addEventListener('click', async function () {

    const btn = this;

    if (!confirm('سيتم تحويل صور المنتجات إلى Supabase Storage. هل تريدين المتابعة؟')) {
        return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ جاري تحويل الصور...';

    try {

        // 1) جلب المنتجات
        const { data: products, error: fetchError } = await supabaseClient
            .from('products')
            .select('id, imageUrl');

        if (fetchError) {
            throw fetchError;
        }

        if (!products || products.length === 0) {
            throw new Error('لم يتم العثور على منتجات.');
        }

        let success = 0;
        let failed = 0;
        let report = '';

        // 2) معالجة كل منتج
        for (const product of products) {

            try {

                if (!product.imageUrl) {
                    failed++;
                    report += '❌ ${product.id}: لا توجد صورة\n';
                    continue;
                }

                // نتأكد أن الصورة Base64
                if (!product.imageUrl.startsWith('data:image/')) {
                    failed++;
                    report += '⚠️ ${product.id}: الصورة ليست Base64\n';
                    continue;
                }

                // استخراج نوع الصورة والبيانات
                const parts = product.imageUrl.split(',');

                if (parts.length !== 2) {
                    throw new Error('صيغة Base64 غير صحيحة');
                }

                const mimeMatch = parts[0].match(/data:(.*?);base64/);

                if (!mimeMatch) {
                    throw new Error('نوع الصورة غير معروف');
                }

                const mimeType = mimeMatch[1];

                const base64Data = parts[1];

                // تحويل Base64 إلى Blob
                const byteCharacters = atob(base64Data);

                const byteArrays = [];

                for (
                    let offset = 0;
                    offset < byteCharacters.length;
                    offset += 1024
                ) {

                    const slice = byteCharacters.slice(
                        offset,
                        offset + 1024
                    );

                    const byteNumbers = new Array(slice.length);

                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    byteArrays.push(new Uint8Array(byteNumbers));
                }

                const blob = new Blob(
                    byteArrays,
                    { type: mimeType }
                );

                // اسم الصورة = ID المنتج
                let extension = 'jpg';

                if (mimeType === 'image/png') {
                    extension = 'png';
                } else if (mimeType === 'image/webp') {
                    extension = 'webp';
                } else if (mimeType === 'image/jpeg') {
                    extension = 'jpg';
                }

                const fileName =' ${product.id}.$png';

                // 3) رفع الصورة إلى Storage
                const { error: uploadError } =
                    await supabaseClient.storage
                        .from('PRODUCT-IMAGE')
                        .upload(
                            fileName,
                            blob,
                            {
                                contentType: mimeType,
                                upsert: true
                            }
                        );

                if (uploadError) {
                    throw uploadError;
                }

                // 4) إنشاء الرابط العام
                const { data: publicUrlData } =
                    supabaseClient.storage
                        .from('PRODUCT-IMAGE')
                        .getPublicUrl(fileName);

                const publicUrl =
                    publicUrlData.publicUrl;
                    // 5) تحديث imageUrl فقط
                const { error: updateError } =
                    await supabaseClient
                        .from('products')
                        .update({
                            imageUrl: publicUrl
                        })
                        .eq('id', product.id);

                if (updateError) {
                    throw updateError;
                }

                success++;

                report +=
                   ' ✅ ${product.id} → ${fileName}\n';

                btn.textContent =
                    '⏳ ${success} / ${products.length}';

            } catch (productError) {

                failed++;

                console.error(
                   ' Error with product ${product.id}:',
                    productError
                );

                report +=
                    '❌ ${product.id}: ${productError.message || JSON.stringify(productError)}\n';
            }
        }

        // 6) النتيجة
        console.log('IMAGE MIGRATION REPORT');
        console.log(report);

        alert(
           ' انتهى تحويل الصور.\n\n '+
           ' نجح: ${success}\n '+
           ' فشل: ${failed}\n\n '+
           ' التفاصيل موجودة في Console'
           
);

        console.log(report);

        btn.textContent =
           '✅ انتهى: ${success} / ${products.length}';

    } catch (error) {

        console.error('MIGRATION ERROR:', error);

        alert(
            'حدث خطأ:\n\n' +
            (error.message || JSON.stringify(error))
        );

        btn.textContent =
            '🚀 تحويل صور المنتجات إلى Storage';

    } finally {

        btn.disabled = false;
    }
    });

  </script>

</body>

</html>
