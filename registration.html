<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
    <title>Register | Lola Accessories and Necklaces</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="registrationTitle">
            <div class="login-brand">
                <img src="img/logo1.jpg" alt="Lola Accessories and Necklaces logo">
            </div>

            <h1 id="registrationTitle">Lola Accessories and Necklaces</h1>
            <p class="login-subtitle">Create your account</p>

            <form id="registrationForm" class="login-form">
                <label class="login-field">
                    <i class="fa-regular fa-user" aria-hidden="true"></i>
                    <span class="sr-only">Full Name</span>
                    <input type="text" id="registerName" placeholder="Full Name" autocomplete="name" required>
                </label>

                <label class="login-field">
                    <i class="fa-regular fa-user" aria-hidden="true"></i>
                    <span class="sr-only">Email or phone number</span>
                    <input type="text" id="registerIdentifier" placeholder="Email or phone number" autocomplete="username" required>
                </label>

                <label class="login-field">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <span class="sr-only">Password</span>
                    <input type="password" id="registerPassword" placeholder="Password" autocomplete="new-password" minlength="6" required>
                </label>

                <label class="login-field">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <span class="sr-only">Confirm Password</span>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="6" required>
                </label>

                <button type="submit" class="login-submit">Create Account <span aria-hidden="true">&#8594;</span></button>
                <p id="registrationMessage" class="login-message" role="status" aria-live="polite"></p>
            </form>

            <p class="register-prompt">Already have an account? <a href="login.html">Sign In</a></p>
        </section>
    </main>

    <script>
        const registrationForm = document.getElementById('registrationForm');
        const registrationMessage = document.getElementById('registrationMessage');
        const registerPassword = document.getElementById('registerPassword');
        const confirmPassword = document.getElementById('confirmPassword');

        registrationForm.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!registrationForm.checkValidity()) {
                registrationForm.reportValidity();
                return;
            }

            if (registerPassword.value !== confirmPassword.value) {
                registrationMessage.textContent = 'Passwords do not match';
                registrationMessage.classList.add('visible');
                confirmPassword.focus();
                return;
            }

            const identifier = document.getElementById('registerIdentifier').value.trim();
            const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier);
            const isPhone = /^\+?[0-9][0-9 ]{7,}$/.test(identifier);
            if (!isEmail && !isPhone) {
                registrationMessage.textContent = 'أدخل بريدًا إلكترونيًا أو رقم هاتف صحيحًا';
                registrationMessage.classList.add('visible');
                return;
            }

            const account = {
                name: document.getElementById('registerName').value.trim(),
                email: isEmail ? identifier.toLowerCase() : '',
                phone: isPhone ? identifier.replace(/\s/g, '') : '',
                password: registerPassword.value
            };
            const customers = JSON.parse(localStorage.getItem('lola-customers') || '[]');
            const duplicate = customers.some(customer =>
                (account.email && customer.email === account.email) ||
                (account.phone && customer.phone === account.phone)
            );
            if (duplicate) {
                registrationMessage.textContent = 'هذا البريد الإلكتروني أو رقم الهاتف مسجل بالفعل';
                registrationMessage.classList.add('visible');
                return;
            }
            account.createdAt = new Date().toISOString();
            customers.push(account);
            localStorage.setItem('lola-customers', JSON.stringify(customers));
            localStorage.setItem('lola-account', JSON.stringify(account));
            localStorage.setItem('lola-remembered-email', identifier);

            registrationMessage.textContent = 'Account created successfully';
            registrationMessage.classList.add('visible');
            setTimeout(() => window.location.href = 'login.html', 700);
        });
    </script>
    <script src="language.js"></script>
</body>

</html>
