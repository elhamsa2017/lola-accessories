<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script src="https://kit.fontawesome.com/865ed70645.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-config.js"></script>
        <script src="auth-guard.js"></script>
        <script src="products-storage.js"></script>
    <title>المتجر | lola accessories and neckales</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo1.jpg" class="logo" alt="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a class="active" href="shop.html">المتجر</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count" id="cartCount">0</span></a></li>
            </ul>
        </div>
    </section>

    <main class="shop-page section-p1">
        <div class="page-intro">
            <h1>تسوق جميع المنتجات</h1>
        </div>

        <div class="shop-controls">
            <div class="filter-pills" aria-label="Product filters">
                <button type="button" class="pill active" data-filter="all">الكل</button>
                <button type="button" class="pill" data-filter="Accessories">كوليهات</button>
                <button type="button" class="pill" data-filter="Necklaces">اساور</button>
                <button type="button" class="pill" data-filter="Bags">نحاس</button>
            </div>
        </div>

        <div id="shopProducts" class="pro-container shop-grid"></div>
    </main>

    <script>
        const CART_KEY = 'lola-accessories-cart';
        let activeFilter = 'all';

        async function loadProducts() {
            return window.productStorage.getProducts();
        }

        function getCart() {
            const saved = localStorage.getItem(CART_KEY);
            try {
                const parsed = saved ? JSON.parse(saved) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function updateCartCount() {
            const countEl = document.getElementById('cartCount');
            if (!countEl) return;
            const count = getCart().reduce((sum, item) => sum + item.quantity, 0);
            countEl.textContent = count;
        }

        function addToCart(productId) {
            const cart = getCart();
            const normalizedProductId = String(productId);
            const existing = cart.find(item => String(item.id) === normalizedProductId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: normalizedProductId, quantity: 1 });
            }
            saveCart(cart);
            updateCartCount();
            alert('تمت إضافة المنتج إلى السلة');
        }

        async function renderShopProducts(filter = 'all') {
            const products = await loadProducts();
            const container = document.getElementById('shopProducts');
            const filtered = filter === 'all' ? products : products.filter(item => item.category === filter);

            container.innerHTML = filtered.map(product => {
                const originalPrice = Number(product.price);
                const discountPrice = Number(product.discount_price);
                const hasDiscount = Number.isFinite(discountPrice) && discountPrice > 0 && discountPrice < originalPrice;
                const discountPercent = hasDiscount ? Math.round((1 - (discountPrice / originalPrice)) * 100) : 0;

                return `
                <div class="pro">
                    <div class="product-image-wrap">
                        ${hasDiscount ? `<span class="discount-badge">-${discountPercent}%</span>` : ''}
                        <img src="${product.imageUrl}" alt="${product.name}">
                    </div>
                    <div class="des">
                        <span>${product.category}</span>
                        <h5>${product.name}</h5>
                         <h5>${product.description}</h5>
                        <div class="stars" aria-label="تقييم 5 نجوم">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="product-price${hasDiscount ? ' has-discount' : ''}">
                            ${hasDiscount
                                          ? `<span class="price-row original-price">السعر قبل الخصم: <b>${originalPrice.toFixed(2)} جنيه</b></span>
                                              <strong class="price-row sale-price">السعر بعد الخصم: <b>${discountPrice.toFixed(2)} جنيه</b></strong>`
                                : `<strong class="regular-price">${originalPrice.toFixed(2)} جنيه</strong>`}
                        </div>
                    </div>
                    <button type="button" class="add-to-cart-btn" data-product-id="${product.id}"><i class="fa-solid fa-cart-shopping"></i> أضف</button>
                </div>
            `;
            }).join('');
            window.translatePage?.(localStorage.getItem('lola-language') || 'ar');
        }

        document.addEventListener('click', (event) => {
            const button = event.target.closest('.add-to-cart-btn');
            if (button) {
                event.preventDefault();
                addToCart(button.dataset.productId);
            }

            const filterButton = event.target.closest('.pill');
            if (filterButton) {
                activeFilter = filterButton.dataset.filter;
                document.querySelectorAll('.pill').forEach(item => item.classList.toggle('active', item === filterButton));
                renderShopProducts(activeFilter);
            }
        });

        window.addEventListener('pageshow', () => renderShopProducts(activeFilter));

        updateCartCount();
        renderShopProducts();
    </script>
    <script src="language.js"></script>

</body>

</html>
